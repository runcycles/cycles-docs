name: cycles-noisy-neighbor
x-service-env: &service-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  WEBHOOK_SECRET_ALLOW_PLAINTEXT: "true"
  ADMIN_API_KEY: local-benchmark-bootstrap
services:
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: redis-server --save "" --appendonly no
    cpus: 1
  runtime:
    image: ghcr.io/runcycles/cycles-server:0.1.25.61
    environment: *service-env
    cpus: 8
    depends_on: [redis]
  admin:
    image: ghcr.io/runcycles/cycles-server-admin:0.1.25.56
    environment: *service-env
    depends_on: [redis]
  load:
    image: node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293
    cpus: 2
    environment:
      ADMIN_API_KEY: local-benchmark-bootstrap
    volumes:
      - ./load.mjs:/load.mjs:ro
    command: node /load.mjs
    profiles: [benchmark]
