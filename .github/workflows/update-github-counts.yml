name: Update GitHub-side counts

# Daily refresh of the GitHub-side fields in installs-cache.json that the
# registry-only workflow (update-installs.yml) deliberately skips:
#
#   - clones / clonesByRepo  (day-cursor accumulator on /traffic/clones)
#   - releases / releasesByRepo  (HWM on release-asset download counts)
#   - ghPackages  (sum of GHCR /orgs/<org>/packages/container/<pkg>.download_count)
#
# Before this workflow existed, those fields only refreshed when a docs deploy
# ran installs.data.ts at build time. During low-deploy weeks the homepage
# clone counter went stale (lastSeenDay frozen for days). This decouples the
# data refresh from the deploy cadence.
#
# Tokens:
#   ORG_TRAFFIC_TOKEN  (PAT) needs scopes:
#     - repo            (for /traffic/clones on each org repo)
#     - read:packages   (for /orgs/<org>/packages/container/<pkg>; if missing,
#                        the GHCR step is skipped with a warning and the
#                        manual-package-counts.json file remains the source
#                        of truth — same behavior as before this workflow)
#
# Schema preservation: the script writes through readCache()/writeCache() and
# reuses the same HWM/cursor logic as installs.data.ts, so build-time and
# scheduled writes converge instead of clobbering.

on:
  schedule:
    - cron: '30 6 * * *'  # 06:30 UTC daily — 30 min after update-installs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          node-version: '20'

      - name: Refresh GitHub-side counts
        env:
          GH_TOKEN: ${{ secrets.ORG_TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/update-github-counts.mjs

      - name: Open PR with refreshed counts
        # Same pattern as adoption-snapshot.yml — uses ORG_TRAFFIC_TOKEN to
        # push and create the PR (default GITHUB_TOKEN can't open PRs unless
        # "Allow Actions to create PRs" is on, which it isn't).
        env:
          GH_TOKEN: ${{ secrets.ORG_TRAFFIC_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet .vitepress/theme/installs-cache.json .vitepress/theme/manual-package-counts.json; then
            echo "No changes to counts — skipping PR."
            exit 0
          fi
          BRANCH="chore/refresh-github-counts-$(date -u +%Y%m%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add .vitepress/theme/installs-cache.json .vitepress/theme/manual-package-counts.json
          git commit -m "chore: refresh GitHub-side counts (clones / releases / ghPackages)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          gh pr create \
            --title "chore: refresh GitHub-side counts $(date -u +%Y-%m-%d)" \
            --body "Automated daily refresh of clones, releases (always 0 across the org — no release assets), and ghPackages. Fields preserved by the registry-only workflow are now updated on a schedule instead of waiting for a deploy build." \
            --head "$BRANCH" \
            --base main
